[package]
name = "cadenza-audio"
version = "1.0.0"
edition = "2021"

[dependencies]
symphonia = { version = "=0.6.1", features = ["all"] }
rubato = "=5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
