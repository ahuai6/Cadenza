# Builds the Windows installer and the portable app on a Windows runner and publishes them as the release of the version
# in package.json (once: a version that already has a release is skipped).
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with: { node-version: 26 }
      - if: steps.v.outputs.skip == 'false'
        shell: bash
        run: |
          npm ci
          npx tsc --noEmit -p .
          npx vitest run
          npm run build:app
          node scripts/models.mjs
          cargo build --release --manifest-path native/cadenza-audio/Cargo.toml
          mkdir -p native/cadenza-audio/target/x86_64-pc-windows-gnu/release
          cp native/cadenza-audio/target/release/cadenza-audio.exe native/cadenza-audio/target/x86_64-pc-windows-gnu/release/
          npx electron-builder --win --x64 --publish never
      - if: steps.v.outputs.skip == 'false'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=${{ steps.v.outputs.version }}
          # (the notes: this version's own section of docs/RELEASE.md only — the file keeps every version, newest first;
          # from its heading to the next version's, without the heading itself, the title says it)
          awk -v h="## Cadenza $v" '$0 == h { on = 1; next } on && /^## Cadenza / { exit } on' docs/RELEASE.md | sed -e '/^---$/d' > notes.md
          test -s notes.md || echo "Cadenza $v" > notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "Cadenza $v" --notes-file notes.md \
            "release/Cadenza-Setup-$v.exe" "release/Cadenza-Setup-$v.exe.blockmap" "release/Cadenza-$v-portable.exe"
